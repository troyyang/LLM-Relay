[package]
name = "llm-relay"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lightweight provider-allowlisted HTTP relay for LLM APIs"

[dependencies]
axum = "0.8"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "signal", "time"] }
tower-http = { version = "0.6", default-features = false, features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter", "std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
